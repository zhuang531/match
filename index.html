</style></head><body><main><h1>牛牛利亚共和国 <small class="guild-subtitle">⚔️ 逆水寒 · 帮会插旗赛</small></h1>

<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script><script>
(()=>{'use strict';

for(const [k,v] of Object.entries(awardDefaults)){if(s.awards[k]===undefined||s.awards[k]==='待定'||(k==='冠军'&&s.awards[k]==='288')||(k==='亚军'&&s.awards[k]==='128')||(k==='季军'&&s.awards[k]==='68'))s.awards[k]=v;}

function say(t){const message=String(t||'');const visible=message.trim().startsWith('✓')?'':message;$('msg').textContent=visible;const g=$('groupStatus');if(g)g.textContent=visible}

function groupWin(i){const sc=s.groupScores[i];if(!sc||!valid(sc[0],sc[1],2))return null;return sc[0]>sc[1]?s.groups[i][0]:s.groups[i][1]}
function groupResult(){const wins=[];if(!s.groups.length)return {ready:false,wins};for(let i=0;i<s.groups.length;i++){const w=groupWin(i);if(!w)return {ready:false,wins};wins.push({name:w,score:s.groupScores[i].includes(0)?'2:0':'2:1',tier:s.groupScores[i].includes(0)?2:1})}return {ready:true,wins}}
function valid(a,b,n){return Number.isInteger(a)&&Number.isInteger(b)&&a>=0&&b>=0&&Math.max(a,b)===n&&Math.min(a,b)<n}
function pairMatches(players){let matches=[];for(let i=0;i<players.length;i++)for(let j=i+1;j<players.length;j++)matches.push({a:players[i],b:players[j],score:null});return matches}
function roundReady(round){return round.matches.every(m=>m.score===0||m.score===1)}
function standings(round){const stats=new Map(round.players.map(n=>[n,{name:n,w:0,l:0}]));for(const m of round.matches){if(m.score===0){stats.get(m.a).w++;stats.get(m.b).l++}if(m.score===1){stats.get(m.b).w++;stats.get(m.a).l++}}return [...stats.values()].sort((a,b)=>b.w-a.w||a.name.localeCompare(b.name,'zh'))}

function qualification(){const gr=groupResult();if(!gr.ready)return {ready:false,reason:'请先完成所有小组赛BO3比分。'};
const tiers=[gr.wins.filter(x=>x.tier===2).map(x=>x.name),gr.wins.filter(x=>x.tier===1).map(x=>x.name)];let chosen=[],roundIndex=0,info=[];
for(let ti=0;ti<2;ti++){
 const players=tiers[ti],seats=8-chosen.length;
 if(seats<=0){info.push({tier:ti,players,kind:'excluded'});continue}

 // Oversubscribed tier. A sequence of mini-leagues resolves the boundary; locked-in players remain locked in.

 while(pool.length>remaining){

}
function syncTie(){let q=qualification();if(q.needRound){const r=q.needRound;s.tieRounds=s.tieRounds.slice(0,r.index);s.tieRounds.push({tier:r.tier,stage:r.stage,players:r.players,seats:r.seats,matches:pairMatches(r.players)});persist();q=qualification()}return q}
function clearLater(){s.tieRounds=[];s.bracket=null;s.bracketScores={};s.thirdScore=null}
function draw(){if(s.names.length<16||s.names.length%2){say('为了全员首轮1v1、无轮空并产生8强，请输入至少16名、且为偶数的参赛选手。');return}if(s.groups.length&&!confirm('重新抽签会清空当前所有比分，确定吗？'))return;const a=shuffle(s.names);s.groups=[];for(let i=0;i<a.length;i+=2)s.groups.push([a[i],a[i+1]]);s.groupScores={};clearLater();persist();show('Group');say('✓ 已随机生成'+s.groups.length+'场BO3小组赛')}
function saveGroup(i){const ia=$('g'+i+'A'),ib=$('g'+i+'B');if(!ia||!ib){say('比分输入框未就绪，请重新进入小组赛界面');return}const a=Number(ia.value),b=Number(ib.value);if(ia.value.trim()===''||ib.value.trim()===''||!valid(a,b,2)){say('第'+(i+1)+'组比分无效：只接受2:0、2:1、0:2或1:2');return}const drafts={};for(let j=0;j<s.groups.length;j++){if(j===i)continue;const x=$('g'+j+'A'),y=$('g'+j+'B');if(x&&y)drafts[j]=[x.value,y.value]}const old=s.groupScores[i];s.groupScores[i]=[a,b];if(!old||old[0]!==a||old[1]!==b)clearLater();const ok=persist();render();for(const [j,vals] of Object.entries(drafts)){const x=$('g'+j+'A'),y=$('g'+j+'B');if(x&&y){x.value=vals[0];y.value=vals[1]}}if(ok)say('✓ 第'+(i+1)+'组比分 '+a+':'+b+' 已保存，胜者：'+(a>b?s.groups[i][0]:s.groups[i][1]));else say('⚠ 第'+(i+1)+'组比分已更新，但浏览器禁止永久保存，请用 Safari 正式网址打开')}
function saveTie(ri,mi){const round=s.tieRounds[ri],m=round?.matches[mi];if(!m)return;const val=document.querySelector('input[name="tie_'+ri+'_'+mi+'"]:checked')?.value;if(val===undefined){say('请先选择BO1获胜者');return}m.score=+val;s.tieRounds=s.tieRounds.slice(0,ri+1);s.bracket=null;s.bracketScores={};s.thirdScore=null;persist();syncTie();render();say('✓ BO1加赛结果已保存')}
function seedBracket(){let q=syncTie();if(!q.ready){say('请先完成小组赛及全部BO1加赛');render();return}if(q.chosen.length!==8){say('晋级人数异常，请检查加赛结果');return}if(s.bracket&&!confirm('重新抽签八强会清空淘汰赛比分，确定吗？'))return;const a=shuffle(q.chosen);s.bracket={players:a};s.bracketScores={};s.thirdScore=null;persist();show('Eight');say('✓ 已生成八强树状图')}
function pair(stage,i){if(!s.bracket)return [null,null];if(stage===0)return s.bracket.players.slice(i*2,i*2+2);if(stage===1)return [bracketWin(0,i*2),bracketWin(0,i*2+1)];return [bracketWin(1,0),bracketWin(1,1)]}
function bracketWin(stage,i){const [a,b]=pair(stage,i),v=s.bracketScores[stage+'_'+i],n=stage===2?3:2;return a&&b&&v&&valid(v[0],v[1],n)?(v[0]>v[1]?a:b):null}

function matchCard(a,b,score,need,key,disabled=false){

 const v=score||[0,0],off=!a||!b||disabled?'disabled':'';
 return `<div class="match ${need===3?'final':''}"><div class="names score-top"><span class="${w===a&&w?'win':''}">${esc(a||'待定')}</span><div class="score-direct no-print"><input aria-label="${esc(a||'选手A')}比分" inputmode="numeric" type="number" min="0" max="${need}" value="${v[0]}" id="${key}A" data-auto="${key}" ${off}><b>:</b><input aria-label="${esc(b||'选手B')}比分" inputmode="numeric" type="number" min="0" max="${need}" value="${v[1]}" id="${key}B" data-auto="${key}" ${off}></div><span class="${w===b&&w?'win':''}" style="text-align:right">${esc(b||'待定')}</span></div>${w?'<small class="match-winner">获胜：'+esc(w)+'</small>':''}</div>`

let q=syncTie();let html='<div class="qual-section"><h3>八强资格 · BO1加赛</h3><p class="qual-notice">2:0胜者优先于2:1胜者。同档人数超过剩余名额时，所有相关选手进行BO1循环赛；若晋级线同分，则同分选手继续BO1循环赛，直到确定八强。无随机轮空。</p>';
html+='<table class="qual-table"><thead><tr><th>优先级</th><th>小组赛胜者</th><th>人数</th></tr></thead><tbody><tr><td>第一档 · 2:0</td><td>'+esc(gr.wins.filter(x=>x.tier===2).map(x=>x.name).join('、')||'无')+'</td><td>'+gr.wins.filter(x=>x.tier===2).length+'</td></tr><tr><td>第二档 · 2:1</td><td>'+esc(gr.wins.filter(x=>x.tier===1).map(x=>x.name).join('、')||'无')+'</td><td>'+gr.wins.filter(x=>x.tier===1).length+'</td></tr></tbody></table>';

function koCard(stage,i){const [a,b]=pair(stage,i);return matchCard(a,b,s.bracketScores[stage+'_'+i],stage===2?3:2,'k'+stage+'_'+i)}
function koHTML(){if(!s.bracket)return '<div class="empty-stage"><span class="empty-stage-icon">🏆</span><p>暂无比赛对阵</p><small>完成小组赛及必要的BO1加赛后，生成八强对阵树</small></div>';const champ=bracketWin(2,0),thirdA=bracketLoser(1,0),thirdB=bracketLoser(1,1),v=s.thirdScore,third=v&&valid(v[0],v[1],3)?(v[0]>v[1]?thirdA:thirdB):null;
const col=(stage,indices,title)=>'<div class="ko-col"><h3>'+title+'</h3><div class="ko-stack">'+indices.map(i=>'<div class="ko-node">'+koCard(stage,i)+'</div>').join('')+'</div></div>';
return '<div class="ko-scroll"><div class="ko-bracket"><div class="ko-wing left">'+col(0,[0,1],'八强赛 · 左半区')+col(1,[0],'半决赛 · 左半区')+'</div><div class="ko-center"><h3>🏆 决赛 · BO5</h3>'+koCard(2,0)+'<p class="champion">'+(champ?'冠军：'+esc(champ):'冠军待定')+'</p><div class="ko-third"><h2 style="text-align:center">🥉 季军赛 · BO5</h2>'+matchCard(thirdA,thirdB,v,3,'third')+'<p class="champion">'+(third?'季军：'+esc(third):'季军待定')+'</p></div></div><div class="ko-wing right">'+col(1,[1],'半决赛 · 右半区')+col(0,[2,3],'八强赛 · 右半区')+'</div></div></div>'}
function saveKO(stage,i){const [a,b]=pair(stage,i),need=stage===2?3:2;if(!a||!b){say('请先完成前一轮比赛');return}const x=+$('k'+stage+'_'+i+'A').value,y=+$('k'+stage+'_'+i+'B').value;if(!valid(x,y,need)){say('请输入有效的BO'+(need*2-1)+'终局比分');return}const old=bracketWin(stage,i);s.bracketScores[stage+'_'+i]=[x,y];if(old!==bracketWin(stage,i)){if(stage===0){delete s.bracketScores['1_'+Math.floor(i/2)];delete s.bracketScores['2_0'];s.thirdScore=null}else if(stage===1){delete s.bracketScores['2_0'];s.thirdScore=null}}persist();render();say('')}
function saveThird(){const a=bracketLoser(1,0),b=bracketLoser(1,1);if(!a||!b){say('请先完成半决赛');return}const x=+$('thirdA').value,y=+$('thirdB').value;if(!valid(x,y,3)){say('季军赛请输入有效BO5比分');return}s.thirdScore=[x,y];persist();render();say('')}
function awards(){const champ=s.bracket?bracketWin(2,0):null,runner=champ?(champ===pair(2,0)[0]?pair(2,0)[1]:pair(2,0)[0]):null;const [a,b]=s.bracket?[bracketLoser(1,0),bracketLoser(1,1)]:[null,null],v=s.thirdScore,third=a&&b&&v&&valid(v[0],v[1],3)?(v[0]>v[1]?a:b):null;
$('awards').innerHTML='<p>🥇 冠军：'+esc(champ||'待定')+'　🥈 亚军：'+esc(runner||'待定')+'　🥉 季军：'+esc(third||'待定')+'</p>'+Object.entries(s.awards).map(([k,val])=>'<label style="display:block;margin:12px 0">'+esc(k)+' <input class="awardInput" data-award="'+esc(k)+'" style="width:min(340px,100%);padding:9px;background:#101d30;color:white;border:1px solid #516b83" value="'+esc(val)+'"></label>').join('')}
function render(){if(document.activeElement!==$('names'))$('names').value=s.names.join('\n');$('count').textContent='当前 '+s.names.length+' 人';$('groupMatches').innerHTML=groupHTML();$('qualification').innerHTML=qualHTML();$('eightMatches').innerHTML=koHTML();awards();document.querySelectorAll('[data-auto]').forEach(el=>{el.addEventListener('focus',()=>{el.select()});el.addEventListener('click',()=>{el.select()})});document.querySelectorAll('[data-auto]').forEach(el=>el.addEventListener('change',()=>{const k=el.dataset.auto;const x=$(k+'A'),y=$(k+'B');if(!x||!y)return;const need=k==='third'||k==='k2_0'?3:2;const a=Number(x.value),b=Number(y.value);if(x.value.trim()===''||y.value.trim()===''||!valid(a,b,need)){if(a!==0||b!==0)say('比分未完成：BO'+(need*2-1)+'需先赢'+need+'局，填写有效终局比分后自动保存');return}if(k[0]==='g')saveGroup(+k.slice(1));else if(k==='third')saveThird();else if(k[0]==='k'){const [st,i]=k.slice(1).split('_').map(Number);saveKO(st,i)}}));document.querySelectorAll('[data-tie]').forEach(b=>b.onclick=()=>{const [r,i]=b.dataset.tie.split('_').map(Number);saveTie(r,i)});const seed=$('seedBracket');if(seed)seed.onclick=seedBracket;document.querySelectorAll('.awardInput').forEach(el=>el.onchange=()=>{s.awards[el.dataset.award]=el.value;persist();say('✓ 奖励已保存')})}
function updateNames(arr){const names=[...new Set(arr.map(x=>String(x??'').trim()).filter(Boolean))];if(names.length<16||names.length%2){say('请提供至少16名且为偶数人数的选手，才能保证全员首轮1v1并产生无轮空八强。');return}if(s.groups.length&&!confirm('更改名单将清空当前所有比赛数据，继续吗？'))return;s.names=names;s.groups=[];s.groupScores={};clearLater();persist();render();say('✓ 已保存'+names.length+'名选手')}
$('saveNames').onclick=()=>updateNames($('names').value.split(/\r?\n/));$('draw').onclick=draw;$('reset').onclick=()=>{if(!confirm('确定重置比赛？将清空参赛名单、所有对阵、比分、加赛及名次结果；奖励设置会保留。'))return;const keptAwards={...s.awards};try{localStorage.removeItem(KEY)}catch(e){}s=initial();s.awards=keptAwards;persist();$('names').value='';$('file').value='';show('List');say('')};$('importBtn').onclick=()=>$('file').click();$('file').onchange=async e=>{const f=e.target.files[0];if(!f)return;try{let arr;if(/\.(csv|tsv)$/i.test(f.name)){arr=(await f.text()).split(/\r?\n/).map(x=>x.split(/[\t,]/)[0])}else{if(!window.XLSX)throw Error('Excel组件加载失败，请检查网络或使用CSV');const wb=XLSX.read(await f.arrayBuffer(),{type:'array'});arr=XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]],{header:1}).map(x=>x[0])}updateNames(arr.map(x=>String(x??'').trim()).filter(x=>x&&!/^(角色名|玩家id|昵称|姓名)$/i.test(x)))}catch(err){say('导入失败：'+err.message)}e.target.value=''};document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>show(b.dataset.tab));$('print').onclick=()=>window.print();render();
})();</script></body></html>
