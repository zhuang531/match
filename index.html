<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script><script>
(()=>{'use strict';

const initial=()=>({names:[],groups:[],groupBye:null,fastByes:[],fastMode:false,groupScores:{},tieRounds:[],bracket:null,bracketScores:{},thirdScore:null,awards:{冠军:'288时装',亚军:'128时装',季军:'68时装',八强奖:'月卡一张',十六强奖:'奶茶一杯',参与奖:'柠檬茶'}});

// Upgrade untouched default awards while keeping user-customized prizes.
const awardDefaults={冠军:'288时装',亚军:'128时装',季军:'68时装',八强奖:'月卡一张',十六强奖:'奶茶一杯',参与奖:'柠檬茶'};

function say(t){const message=String(t||'');const visible=message.trim().startsWith('✓')?'':message;$('msg').textContent=visible}

function groupWin(i){const sc=s.groupScores[i];if(!sc||!valid(sc[0],sc[1],2))return null;return sc[0]>sc[1]?s.groups[i][0]:s.groups[i][1]}
function groupResult(){const wins=[];if(!s.groups.length&&!s.fastMode)return {ready:false,wins};if(s.fastMode){if(s.groupBye)wins.push({name:s.groupBye,score:'首轮轮空',tier:0})}else if(s.groupBye)wins.push({name:s.groupBye,score:'轮空',tier:0});for(let i=0;i<s.groups.length;i++){const w=groupWin(i);if(!w)return {ready:false,wins};const score=s.groupScores[i].map(Number);const loserScore=Math.min(score[0],score[1]);wins.push({name:w,score:loserScore===0?'2:0':'2:1',tier:loserScore===0?2:1})}return {ready:true,wins}}

// V103: 1V1 24+ entrants enter the sixteen-player knockout; 3V3 remains unchanged.
function targetSize(){return s.names.length>=24?16:8}
function hasSixteenRound(){return (s.bracket&&s.bracket.players?.length===16)||s.names.length>=24}

// Minimal-match BO1 qualifier: eliminate exactly the excess candidates, never a round robin.
function qualifierDraw(players,seats){

}
function roundReady(round){return round.matches.every(m=>m.score===0||m.score===1)}

function qualification(){

function clearLater(){s.tieRounds=[];s.bracket=null;s.bracketScores={};s.thirdScore=null}
function draw(){if(s.names.length<8){say('当前版本至少需要8名选手才能生成八强对阵。');return}if((s.groups.length||s.fastMode)&&!confirm('重新抽签会清空当前所有比分，确定吗？'))return;const a=shuffle(s.names);s.fastMode=a.length<16;s.fastByes=[];s.groupBye=null;s.groups=[];if(s.fastMode){s.groupBye=a.length%2?a.pop():null;for(let i=0;i<a.length;i+=2)s.groups.push([a[i],a[i+1]]);}else{s.groupBye=a.length%2?a.pop():null;for(let i=0;i<a.length;i+=2)s.groups.push([a[i],a[i+1]]);}s.groupScores={};clearLater();persist();show('Group');say('✓ 已随机生成'+s.groups.length+'场BO3小组赛')}
function saveGroup(i){const ia=$('g'+i+'A'),ib=$('g'+i+'B');if(!ia||!ib){say('比分输入框未就绪，请重新进入小组赛界面');return}const a=Number(ia.value),b=Number(ib.value);if(ia.value.trim()===''||ib.value.trim()===''||!valid(a,b,2)){say('第'+(i+1)+'组比分无效：只接受2:0、2:1、0:2或1:2');return}const drafts={};for(let j=0;j<s.groups.length;j++){if(j===i)continue;const x=$('g'+j+'A'),y=$('g'+j+'B');if(x&&y)drafts[j]=[x.value,y.value]}const old=s.groupScores[i];s.groupScores[i]=[a,b];if(!old||old[0]!==a||old[1]!==b)clearLater();const ok=persist();render();for(const [j,vals] of Object.entries(drafts)){const x=$('g'+j+'A'),y=$('g'+j+'B');if(x&&y){x.value=vals[0];y.value=vals[1]}}if(ok)say('✓ 第'+(i+1)+'组比分 '+a+':'+b+' 已保存，胜者：'+(a>b?s.groups[i][0]:s.groups[i][1]));else say('⚠ 第'+(i+1)+'组比分已更新，但浏览器禁止永久保存，请用 Safari 正式网址打开')}

function pair(stage,i){

function bracketWin(stage,i){

// V53: Keep the original player ID in state; only split its VISUAL label.

function qualHTML(){

 html+='<table class="qual-table"><thead><tr><th>优先级</th><th>小组赛胜者</th><th>人数</th></tr></thead><tbody><tr><td>第一档 · 2:0</td><td>'+esc(gr.wins.filter(x=>x.tier===2).map(x=>x.name).join('、')||'无')+'</td><td>'+gr.wins.filter(x=>x.tier===2).length+'</td></tr><tr><td>第二档 · 2:1</td><td>'+esc(gr.wins.filter(x=>x.tier===1).map(x=>x.name).join('、')||'无')+'</td><td>'+gr.wins.filter(x=>x.tier===1).length+'</td></tr><tr><td>🍀 首轮轮空 · 独立候选</td><td>'+esc(gr.wins.filter(x=>x.tier===0).map(x=>x.name).join('、')||'无')+'</td><td>'+gr.wins.filter(x=>x.tier===0).length+'</td></tr><tr><td>第四档 · 首轮败者复活候选</td><td>'+esc(s.groups.map((pair,i)=>pair.find(n=>n!==groupWin(i))).join('、')||'无')+'</td><td>'+s.groups.length+'</td></tr></tbody></table>';

function koCard(stage,i){const [a,b]=pair(stage,i);return matchCard(a,b,s.bracketScores[stage+'_'+i],stage===finalStage()?3:2,'k'+stage+'_'+i)}

function saveKO(stage,i){

function awards(){

// V44: Click a score to add one game; Enter/Backspace/Delete clears the selected score.
// Partial scores are persisted, but only completed BO3/BO5 results produce winners.
function setClickScore(key, side, nextValue){
  const left=$(key+'A'),right=$(key+'B');
  if(!left||!right||left.disabled||right.disabled)return;
  const need=key.startsWith('tie_')?1:(key==='third'||key==='k'+finalStage()+'_0'?3:2);
  const values=[Number(left.value)||0,Number(right.value)||0];
  const oldValue=values[side];
  nextValue=Math.max(0,Math.min(need,nextValue));
  if(oldValue===nextValue)return;
  values[side]=nextValue;
  // A BO3/BO5 cannot finish with both players reaching the winning score.
  if(values[0]===need&&values[1]===need)return;
  const completed=valid(values[0],values[1],need);
  if(key.startsWith('tie_')){
    const [ri,mi]=key.slice(4).split('_').map(Number);
    const round=s.tieRounds[ri],match=round?.matches[mi];
    if(!match)return;
    const previous=match.score;
    match.points=values;
    match.score=completed?(values[0]===1?0:1):null;
    // A changed outcome invalidates all later tiebreak rounds and knockout scores.
    if(previous!==match.score){
      s.tieRounds=s.tieRounds.slice(0,ri+1);
      s.bracket=null;s.bracketScores={};s.thirdScore=null;
    }
  }else if(key[0]==='g'){
    const i=Number(key.slice(1));
    const old=s.groupScores[i];
    s.groupScores[i]=values;
    // Re-evaluate qualifications if an already completed match is edited.
    if(old&&valid(old[0],old[1],2)&&
       (old[0]!==values[0]||old[1]!==values[1]))clearLater();
  }else if(key==='third'){
    s.thirdScore=values;
  }else if(key[0]==='k'){
    const [stage,i]=key.slice(1).split('_').map(Number);
    const oldWinner=bracketWin(stage,i);
    s.bracketScores[stage+'_'+i]=values;
    const newWinner=bracketWin(stage,i);
    if(oldWinner!==newWinner)clearDescendants(stage,i);
  }else return;
  persist();
  // Rerender keeps match winner, qualification and awards in sync.
  // Restore focus so Enter can immediately clear the just-clicked score.
  render();
  const replacement=$(key+(side===0?'A':'B'));
  if(replacement&&!replacement.disabled){
    try{replacement.focus({preventScroll:true})}catch(e){replacement.focus()}
  }
  say('');
}

// V47: Draw full tournament-tree links based on actual on-screen card geometry.
// Recalculate after every score change, tab switch, or window resize.
function drawKoConnections(){
 const root=document.querySelector('#eightMatches .ko-bracket');
 if(!root||!root.getClientRects().length)return;
 const svg=root.querySelector('.ko-lines');if(!svg)return;
 const bounds=root.getBoundingClientRect();
 const W=root.scrollWidth,H=root.scrollHeight;
 svg.setAttribute('width',W);svg.setAttribute('height',H);
 svg.setAttribute('viewBox',`0 0 ${W} ${H}`);
 const pos=(el)=>{
  if(!el)return null;
  const r=el.getBoundingClientRect();
  return {l:r.left-bounds.left,r:r.right-bounds.left,y:(r.top+r.bottom)/2-bounds.top};
 };
 const node=(wing,stage,index)=>pos(root.querySelector(`.ko-wing.${wing} .ko-node[data-ko-stage="${stage}"][data-ko-index="${index}"] .match`));
 const final=pos(root.querySelector('.ko-final-spot .match'));
 // V52: 将左右半决赛卡片的垂直中心与决赛卡片对齐，
 // 保证连接线真正水平，而不只是把斜线换成水平指令。
 const semiStage=root.classList.contains('ko16')?2:1;
 for(const [wing,index] of [['left',0],['right',1]]){
  const semiNode=root.querySelector(`.ko-wing.${wing} .ko-node[data-ko-stage="${semiStage}"][data-ko-index="${index}"]`);
  if(!semiNode||!final)continue;
  semiNode.style.transform='none';
  const original=pos(semiNode.querySelector('.match'));
  if(original){
   const shift=final.y-original.y;
   semiNode.style.transform=`translateY(${shift}px)`;
  }
 }
 const paths=[];
 const path=(d)=>{if(d)paths.push(`<path d="${d}"/>`)};
 // Connect two earlier-round cards into the following round as a fork.
 function fork(a,b,dest,side){
  if(!a||!b||!dest)return;
  const x1=side==='left'?a.r:a.l, x2=side==='left'?b.r:b.l;
  const tx=side==='left'?dest.l:dest.r;
  const branch=(Math.max(x1,x2)+tx)/2;
  // For right half the preceding cards are to the right of the target.
  const jx=side==='left'?branch:(Math.min(x1,x2)+tx)/2;
  const mid=(a.y+b.y)/2;
  path(`M ${x1} ${a.y} H ${jx} M ${x2} ${b.y} H ${jx} M ${jx} ${a.y} V ${b.y} M ${jx} ${mid} V ${dest.y} H ${tx}`);
 }
 function single(src,dest,side){
  if(!src||!dest)return;
  const sx=side==='left'?src.r:src.l,tx=side==='left'?dest.l:dest.r;
  // V52: 半决赛和决赛中心已对齐，画一条完全水平的金色直线。
  path(`M ${sx} ${dest.y} H ${tx}`);
 }
 const n=root.classList.contains('ko16')?16:8;
 if(n===16){
  for(let k=0;k<2;k++)fork(node('left',0,2*k),node('left',0,2*k+1),node('left',1,k),'left');
  fork(node('left',1,0),node('left',1,1),node('left',2,0),'left');
  for(let k=0;k<2;k++)fork(node('right',0,4+2*k),node('right',0,5+2*k),node('right',1,2+k),'right');
  fork(node('right',1,2),node('right',1,3),node('right',2,1),'right');
  single(node('left',2,0),final,'left');
  single(node('right',2,1),final,'right');
 }else{
  fork(node('left',0,0),node('left',0,1),node('left',1,0),'left');
  fork(node('right',0,2),node('right',0,3),node('right',1,1),'right');
  single(node('left',1,0),final,'left');
  single(node('right',1,1),final,'right');
 }
 svg.innerHTML=paths.join('');
}
window.addEventListener('resize',()=>requestAnimationFrame(drawKoConnections));

async function teamPick(title,items){const n=await adjustUI(title,items);return n===null?-1:n}
async function teamAdjust(which){
 if(which==='groups'&&!state.groups.length){alert('请先抽签');return}
 if(which==='knockout'&&!state.bracket){alert('请先生成八强');return}
 const phases=which==='groups'?['小组赛','资格加赛']:['八强赛','半决赛','决赛','季军赛'];
 const phase=await teamPick('选择阶段',phases);if(phase<0)return;
 let matches=[],keyFn, max,source;
 if(which==='groups'&&phase===0){matches=state.groups;keyFn=i=>'g'+i;max=1;source='group'}
 else if(which==='groups'){const round=await teamPick('选择资格赛轮次',state.qualRounds.map((_,i)=>'第'+(i+1)+'轮'));if(round<0)return;matches=state.qualRounds[round].matches;keyFn=i=>'q'+round+'_'+i;max=1;source='qual';sourceRound=round}
 else{const b=bracketMatches();matches=phase===0?b.r8:phase===1?b.semi:phase===2?[b.final]:[b.third];keyFn=i=>phase===0?'r8'+i:phase===1?'semi'+i:phase===2?'final':'third';max=phase>=2?3:2;source='ko'}
 const i=await teamPick('选择场次',matches.map((_,j)=>'第'+(j+1)+'场'));if(i<0)return;
 const m=matches[i];if(!m||!m[0]||!m[1]){alert('对阵尚未确定');return}
 const action=await teamPick(teamName(m[0])+' VS '+teamName(m[1])+'\n选择调整方式',['左方弃权 / 右方获胜','右方弃权 / 左方获胜','指定左方获胜','指定右方获胜','交换双方位置并清空比分（仅首轮）','替换队伍 / 与其他场次交换（仅小组赛或八强首轮）','修改队伍成员（不影响比分）','撤销最近一次调整']);if(action<0)return;
 if(action===7){teamUndo();return}
 if((action===4||action===5)&&!(source==='group'||source==='ko'&&phase===0)){alert('此阶段对阵由上一轮胜负决定，请先修改上一轮。');return}
 let side=0,replacement=null,found=null,memberIndex=null,newMember=null;
 if(action===5){side=await teamPick('选择替换位置',m.map(teamName));if(side<0)return;const pool=state.teams.filter(t=>t.id!==m[side]);const k=await teamPick('选择队伍；已在其他场次的队伍将交换位置',pool.map(t=>t.name));if(k<0)return;replacement=pool[k].id}
 if(action===6){side=await teamPick('选择要修改成员的队伍',m.map(teamName));if(side<0)return;memberIndex=await teamPick('选择成员角色',['奶妈','DPS1','DPS2']);if(memberIndex<0)return;newMember=await adjustUI('输入新的玩家昵称',[],'text');if(!newMember?.trim())return;newMember=newMember.trim();if(state.teams.some(t=>[t.heal,t.dps1,t.dps2].includes(newMember))){alert('该玩家已报名，不能重复');return}}
 if((await adjustUI('确认调整？将自动备份当前数据，受影响的后续比分可能被清空。',['确认调整']))===null)return;
 teamSnapshot();
 if(action===6){const t=state.teams.find(t=>t.id===m[side]);t[['heal','dps1','dps2'][memberIndex]]=newMember}
 else if(action===5){const old=m[side];if(source==='group'){state.groups[i][side]=replacement;for(let x=0;x<state.groups.length;x++)for(let y=0;y<2;y++)if((x!==i||y!==side)&&state.groups[x][y]===replacement){state.groups[x][y]=old;delete state.groupScores[x]}if(state.groupBye===replacement)state.groupBye=old;delete state.groupScores[i];state.qualRounds=[];state.bracket=null;state.koScores={}}
 else{const at=i*2+side;const pos=state.bracket.indexOf(replacement);state.bracket[at]=replacement;if(pos>=0)state.bracket[pos]=old;state.koScores={}}}
 else if(action===4){if(source==='group'){state.groups[i].reverse();delete state.groupScores[i];state.qualRounds=[];state.bracket=null;state.koScores={}}
 else{const at=i*2;[state.bracket[at],state.bracket[at+1]]=[state.bracket[at+1],state.bracket[at]];state.koScores={}}}
 else{const score=(action===1||action===2)?[max,0]:[0,max];if(source==='group'){state.groupScores[i]=score;state.qualRounds=[];state.bracket=null;state.koScores={}}
 else if(source==='qual'){state.qualRounds[sourceRound].scores[i]=score;state.qualRounds=state.qualRounds.slice(0,sourceRound+1);state.bracket=null;state.koScores={}}
 else{const key=keyFn(i);state.koScores[key]=score;if(phase===0)Object.keys(state.koScores).filter(k=>!k.startsWith('r8')).forEach(k=>delete state.koScores[k]);if(phase===1){delete state.koScores.final;delete state.koScores.third}}}
 save();render();alert('调整已保存。')
}
